name: Publish Camel Hub 1.0.14 payload

on:
  push:
    paths:
      - ".github/workflows/publish-camelhub-1.0.14.yml"

permissions:
  contents: write
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild staged release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          issue = 2
          url = f"https://api.github.com/repos/{repo}/issues/{issue}/comments?per_page=100"
          req = urllib.request.Request(url, headers={
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req) as r:
              comments = json.load(r)

          groups = {}
          for c in comments:
              body = c.get("body") or ""
              if not body.startswith("PAYLOAD|"):
                  continue
              header, payload = body.split("\n", 1)
              _, path, part, total = header.split("|")
              part, total = int(part), int(total)
              g = groups.setdefault(path, {"total": total, "parts": {}})
              if g["total"] != total:
                  raise RuntimeError(f"conflicting part count for {path}")
              g["parts"][part] = "".join(payload.split())

          expected = {
              "vBot/playerlist.lua": "e3c63aec66d96a1a9940b9c438d2ef47ff1fb63a434bcccf8f0ba220917768d2",
              "vBot/RescueSystem.lua": "7802ec370c2b0490f93ba43398a38f01beb66be7408b0a615c742cfa13bf8ad3",
              "vBot/CamelHubUpdater.lua": "a0fc078a657e7b7a61d1781e084ec5c29dea794ccf723fb2d968607a51413a2a",
          }

          for path, sha in expected.items():
              g = groups.get(path)
              if not g or len(g["parts"]) != g["total"]:
                  raise RuntimeError(f"incomplete staged payload for {path}")
              encoded = "".join(g["parts"][i] for i in range(1, g["total"] + 1))
              data = gzip.decompress(base64.b64decode(encoded))
              normalized = data.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
              actual = hashlib.sha256(normalized).hexdigest()
              if actual != sha:
                  raise RuntimeError(f"checksum mismatch for {path}: {actual}")
              target = pathlib.Path("release") / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              print(f"wrote {target} ({len(data)} bytes)")
          PY

      - name: Commit release files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/vBot/playerlist.lua release/vBot/RescueSystem.lua release/vBot/CamelHubUpdater.lua
          if git diff --cached --quiet; then
            echo "No staged release changes."
          else
            git commit -m "Camel Hub 1.0.14: Guild Sync and Rescue low-traffic"
            git push
          fi
